name: Build JARVIS EXE

on:
  push:
    branches: [ main ]
    tags: [ '*']
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~\AppData\Local\pip\Cache
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install pyinstaller
        pip install -r requirements.txt
        pip install pywin32 || echo "pywin32 install failed, skipping"
        pip install pycaw || echo "pycaw install failed, skipping"
        pip install WMI || echo "WMI install failed, skipping"
        pip install pipwin
        pipwin install pyaudio || echo "PyAudio install failed, skipping"
      shell: pwsh
      continue-on-error: true

    - name: Prepare build directory
      run: |
        New-Item -ItemType Directory -Force -Path dist\JARVIS
        if (Test-Path config.json) { Copy-Item config.json dist\JARVIS\ }
        Copy-Item .env.example dist\JARVIS\.env
        if (Test-Path "assets") {
          Copy-Item -Recurse -Force assets dist\JARVIS\assets
        }
      shell: pwsh

    - name: Build EXE with PyInstaller
      run: |
        pyinstaller jarvis.spec
      shell: pwsh

    - name: Copy built files to dist
      run: |
        if (Test-Path "dist\JARVIS.exe") {
          Move-Item dist\JARVIS.exe dist\JARVIS\JARVIS.exe -Force
          Write-Host "EXE copied to dist\JARVIS"
        } elseif (Test-Path "build\JARVIS\JARVIS.exe") {
          Copy-Item build\JARVIS\JARVIS.exe dist\JARVIS\JARVIS.exe -Force
          Write-Host "EXE copied from build folder"
        } else {
          Write-Host "Warning: EXE not found, but continuing..."
        }
      shell: pwsh
      continue-on-error: true

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: JARVIS-EXE
        path: dist/JARVIS/
        retention-days: 30

    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: dist/JARVIS/JARVIS.exe
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-installer:
    runs-on: windows-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: JARVIS-EXE
        path: dist/JARVIS/

    - name: Install Inno Setup
      run: |
        choco install innosetup -y
        Write-Host "Inno Setup installed"
      shell: pwsh

    - name: Build Installer
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\jarvis_installer.iss
      shell: pwsh

    - name: Upload Installer
      uses: softprops/action-gh-release@v2
      with:
        files: installer/output/JARVIS_Ultimate_Setup_*.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
