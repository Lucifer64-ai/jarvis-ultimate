name: Build JARVIS EXE

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~\AppData\Local\pip\Cache
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Build EXE with PyInstaller
      run: |
        cd build
        pyinstaller jarvis.spec --clean --noconfirm
    
    - name: Prepare distribution
      run: |
        mkdir dist\JARVIS
        copy config.json dist\JARVIS\
        copy .env.example dist\JARVIS\.env
        if (Test-Path "assets") {
          xcopy /E /I /Y assets dist\JARVIS\assets
        }
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: JARVIS-EXE
        path: dist/JARVIS/
        retention-days: 30
    
    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: dist/JARVIS/JARVIS.exe
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-installer:
    runs-on: windows-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: JARVIS-EXE
        path: dist/JARVIS/
    
    - name: Install Inno Setup
      run: |
        choco install innosetup -y
    
    - name: Build Installer
      run: |
        iscc installer\jarvis_installer.iss
    
    - name: Upload Installer
      uses: softprops/action-gh-release@v1
      with:
        files: installer/output/JARVIS_Ultimate_Setup.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
