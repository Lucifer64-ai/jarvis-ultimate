name: Build JARVIS EXE

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~\AppData\Local\pip\Cache
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r requirements.txt
      shell: pwsh
    
    - name: Prepare build directory
      run: |
        New-Item -ItemType Directory -Force -Path dist\JARVIS
        Copy-Item config.json dist\JARVIS\
        Copy-Item .env.example dist\JARVIS\.env
        if (Test-Path "assets") {
          Copy-Item -Recurse -Force assets dist\JARVIS\assets
        }
      shell: pwsh
    
    - name: Build EXE with PyInstaller (onefile)
      run: |
        pyinstaller --onefile --windowed --name JARVIS --icon=assets/jarvis.ico main.py
      shell: pwsh
      continue-on-error: true
    
    - name: Build EXE with PyInstaller (onedir fallback)
      if: failure()
      run: |
        pyinstaller --onedir --windowed --name JARVIS main.py
      shell: pwsh
      continue-on-error: true
    
    - name: Copy built files to dist
      run: |
        if (Test-Path "dist\JARVIS.exe") {
          Move-Item dist\JARVIS.exe dist\JARVIS\JARVIS.exe -Force
        } elseif (Test-Path "dist\JARVIS\JARVIS.exe") {
          Write-Host "EXE already in dist\JARVIS"
        } else {
          Write-Host "Warning: EXE not found, checking build directory"
          if (Test-Path "build\JARVIS") {
            Copy-Item -Recurse build\JARVIS\* dist\JARVIS\ -Force
          }
        }
      shell: pwsh
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: JARVIS-EXE
        path: dist/JARVIS/
        retention-days: 30
    
    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: dist/JARVIS/JARVIS.exe
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-installer:
    runs-on: windows-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: JARVIS-EXE
        path: dist/JARVIS/
    
    - name: Install Inno Setup
      run: |
        choco install innosetup -y
      shell: pwsh
    
    - name: Build Installer
      run: |
        iscc installer\jarvis_installer.iss
      shell: pwsh
    
    - name: Upload Installer
      uses: softprops/action-gh-release@v2
      with:
        files: installer/output/JARVIS_Ultimate_Setup.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
